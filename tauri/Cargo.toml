[package]
name = "techdoro"
version = "3.0.1"
description = "A simple Pomodoro timer with a task list for your desktop"
authors = ["Zelchi"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "techdoro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [ "tray-icon"] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-updater = "2.11.0"
