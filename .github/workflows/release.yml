name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  frontend:
    name: check
    runs-on: ubuntu-22.04

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: yarn
        run: corepack enable

      - name: deps
        run: yarn install --frozen-lockfile --ignore-engines

      - name: check
        run: yarn run check

  publish-tauri:
    name: build
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: yarn
        run: corepack enable

      - name: rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/tauri
            tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget \
            xdg-utils

      - name: deps
        run: yarn install --frozen-lockfile --ignore-engines

      - name: version
        id: release_version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: release notes
        id: release_notes
        shell: bash
        run: |
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "::error::Arquivo de notas não encontrado: $notes_file"
            exit 1
          fi

          {
            echo "body<<RELEASE_NOTES"
            cat "$notes_file"
            echo "RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: yarn tauri
          tagName: ${{ github.ref_name }}
          releaseName: Techdoro ${{ steps.release_version.outputs.version }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          retryAttempts: 2
          args: --config tauri/tauri.conf.json ${{ matrix.args }}

  publish-release:
    name: release
    needs: publish-tauri
    runs-on: ubuntu-22.04

    steps:
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
