name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            formats: deb
            binary: target/release/techdoro
          - os: windows-latest
            platform: windows-x86_64
            formats: nsis
            binary: target/release/techdoro.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate release version and notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs validate-tag "$RELEASE_TAG"
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config \
            libfontconfig1-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev libvulkan1 libxkbcommon-dev \
            patchelf librsvg2-bin file xdg-utils rpm cpio desktop-file-utils
      - name: Install packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Install RPM generator
        if: runner.os == 'Linux'
        run: cargo install cargo-generate-rpm --version 0.21.0 --locked
      - name: Build signed installers
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TECHDORO_UPDATER_PUBLIC_KEY: ${{ vars.TECHDORO_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" ]]; then
            echo "::error::Configure CARGO_PACKAGER_SIGN_PRIVATE_KEY before publishing."
            exit 1
          fi
          if [[ -z "$TECHDORO_UPDATER_PUBLIC_KEY" ]]; then
            unset TECHDORO_UPDATER_PUBLIC_KEY
          fi
          cargo packager --release --formats "${{ matrix.formats }}"
          if [[ "$RUNNER_OS" == Linux ]]; then
            cargo generate-rpm -o target/packages
            for rpm_file in target/packages/*.rpm; do
              cargo packager signer sign "$rpm_file"
            done
          fi
      - name: Verify packaged launchers and icons
        run: node scripts/verify-package-icons.mjs
      - name: Stage signed artifacts
        run: node scripts/release.mjs stage "${{ matrix.platform }}" --verify "${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: target/release-assets/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate updater manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs manifest "$GITHUB_REPOSITORY" "$RELEASE_TAG"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [[ "$draft" != true ]]; then
              echo "::error::Refusing to replace an already published release."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Techdoro ${RELEASE_TAG#v}" --notes-file ".github/release-notes/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            release-assets/*.deb release-assets/*.rpm release-assets/*.exe \
            release-assets/*.sig release-assets/native-latest.json
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
